[package]
name = "llmprobe"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio        = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest      = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }   # reqwest 0.13 renamed `rustls-tls` -> `rustls` (rustls + aws-lc-rs, no system OpenSSL)
futures-util = "0.3.32"
serde        = { version = "1.0.228", features = ["derive"] }
serde_json   = "1.0.150"
clap         = { version = "4.6.1", features = ["derive", "env"] }
thiserror    = "2.0.18"
ratatui      = { version = "0.30.0", optional = true }   # crossterm is used via ratatui::crossterm

[features]
default = ["tui"]
tui     = ["dep:ratatui"]

[dev-dependencies]
wiremock = "0.6.5"
axum     = "0.8.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
